name: rocky-linux-9-stig-ready-baseline
title: Rocky Linux 9 STIG-ready baseline
maintainer: MITRE SAF Team
copyright: MITRE
license: Apache-2.0
summary: "InSpec profile adapted from the DISA RHEL 9 STIG for Rocky Linux 9"
version: 2.7.1
inspec_version: ">= 5.0"

supports:
  - platform-family: redhat
    release: 9.*

depends:
  - name: redhat-enterprise-linux-9-stig-baseline
    git: https://github.com/mitre/redhat-enterprise-linux-9-stig-baseline.git
    # Interim: track the upstream's open patch branch, which carries fixes
    # this profile depends on (broken-test repairs, version correction).
    # Replace with a tag pin once the branch merges and a release is cut.
    branch: "2.7.1"
    
### ROCKY-SPECIFIC INPUT OVERRIDES ###
# The RHEL dependency supplies the full input set. This overlay declares only
# defaults whose Rocky Linux values differ from the RHEL baseline. Sites may
# override these defaults with an input file or CLI flag.
###

inputs:
  # SV-257819: Rocky's package-signing key path, label, and fingerprint.
  - name: rpm_gpg_file
    description: Rocky Linux package-signing key file
    type: String
    value: /etc/pki/rpm-gpg/RPM-GPG-KEY-Rocky-9
    profile: redhat-enterprise-linux-9-stig-baseline

  - name: rpm_gpg_keys
    description: Rocky Linux package-signing key labels with matching fingerprints
    type: Hash
    value:
      "Rocky Enterprise Software Foundation - Release key 2022": "21CB 256A E16F C54C 6E65 2949 702D 426D 350D 275D"
    profile: redhat-enterprise-linux-9-stig-baseline

  # Audit-watch controls SV-258176 through SV-258226.
  # Rocky maps /usr/sbin/setsebool to the "privileged" audit key; all other
  # values retain the RHEL baseline defaults.
  - name: audit_rule_keynames
    description: The audit rules to be applied to the system
    type: Hash
    value: {
      'execve'                        : 'execpriv',
      '/etc/shadow'                   : 'identity',
      '/etc/security/opasswd'         : 'identity',
      '/etc/passwd'                   : 'identity',
      '/etc/gshadow'                  : 'identity',
      '/etc/group'                    : 'identity',
      '/etc/sudoers'                  : 'identity',
      '/etc/sudoers.d'                : 'identity',
      '/usr/bin/su'                   : 'privileged-priv_change',
      'setxattr'                      : 'perm_mod',
      'fsetxattr'                     : 'perm_mod',
      'lsetxattr'                     : 'perm_mod',
      'removexattr'                   : 'perm_mod',
      'fremovexattr'                  : 'perm_mod',
      'lremovexattr'                  : 'perm_mod',
      '/usr/bin/chage'                : 'privileged-chage',
      '/usr/bin/chcon'                : 'perm_mod',
      '/usr/bin/ssh-agent'            : 'privileged-ssh',
      '/usr/bin/passwd'               : 'privileged-passwd',
      '/usr/bin/mount'                : 'privileged-mount',
      '/usr/bin/umount'               : 'privileged-mount',
      'mount'                         : 'privileged-mount',
      'umount'                        : 'privileged-umount',
      '/usr/sbin/unix_update'         : 'privileged-unix-update',
      '/usr/sbin/postdrop'            : 'privileged-unix-update',
      '/usr/sbin/postqueue'           : 'privileged-unix-update',
      '/usr/sbin/semanage'            : 'privileged-unix-update',
      '/usr/sbin/setfiles'            : 'privileged-unix-update',
      '/usr/sbin/userhelper'          : 'privileged-unix-update',
      '/usr/sbin/setsebool'           : 'privileged',
      '/usr/sbin/unix_chkpwd'         : 'privileged-unix-update',
      '/usr/libexec/openssh/ssh-keysign' : 'privileged-ssh',
      '/usr/bin/setfacl'              : 'perm_mod',
      '/usr/sbin/pam_timestamp_check' : 'privileged-pam_timestamp_check',
      '/usr/bin/newgrp'               : 'priv_cmd',
      'init_module'                   : 'module_chng',
      'finit_module'                  : 'module_chng',
      'rename'                        : 'delete',
      'unlink'                        : 'delete',
      'rmdir'                         : 'delete',
      'renameat'                      : 'delete',
      'unlinkat'                      : 'delete',
      '/usr/bin/gpasswd'              : 'privileged-gpasswd',
      'delete_module'                 : 'module_chng',
      '/usr/bin/crontab'              : 'privileged-crontab',
      '/usr/bin/chsh'                 : 'priv_cmd',
      'truncate'                      : 'perm_access',
      'ftruncate'                     : 'perm_access',
      'creat'                         : 'perm_access',
      'open'                          : 'perm_access',
      'openat'                        : 'perm_access',
      'open_by_handle_at'             : 'perm_access',
      'chown'                         : 'perm_mod',
      'fchown'                        : 'perm_mod',
      'fchownat'                      : 'perm_mod',
      'lchown'                        : 'perm_mod',
      'chmod'                         : 'perm_mod',
      'fchmod'                        : 'perm_mod',
      'fchmodat'                      : 'perm_mod',
      '/usr/bin/sudo'                 : 'priv_cmd',
      '/usr/sbin/usermod'             : 'privileged-usermod',
      '/usr/bin/chacl'                : 'perm_mod',
      '/usr/bin/kmod'                 : 'modules',
      '/var/log/faillock'             : 'logins',
      '/var/log/lastlog'              : 'logins',
      '/usr/bin/sudoedit'             : 'priv_cmd',
      '/usr/sbin/init'                : 'privileged-init',
      '/usr/sbin/poweroff'            : 'privileged-poweroff',
      '/usr/sbin/reboot'              : 'privileged-reboot',
      '/usr/sbin/shutdown'            : 'privileged-shutdown',
      'umount2'                       : 'perm_mod',
      '/var/log/tallylog'             : 'logins',
      '/etc/cron.d'                   : 'cronjobs',
      '/var/spool/cron'               : 'cronjobs'
    }
    profile: redhat-enterprise-linux-9-stig-baseline
